name: Build and deploy Python app to Azure Web App - exit-poll-ve

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package app for Azure
        run: |
          mkdir -p deploy_root
          cp -R backend/. deploy_root/
          pip install -r backend/requirements.txt --target deploy_root/.python_packages/lib/site-packages
          # El .git no se despliega, asi que la app no puede deducir el commit
          # en runtime. Lo dejamos escrito en el artefacto: app.py lee este
          # fichero para /version y para el badge del navbar.
          echo "${GITHUB_SHA} $(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy_root/VERSION
          cat deploy_root/VERSION

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy_root/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'exit-poll-ve'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
